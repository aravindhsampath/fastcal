[package]
name = "fastcal"
version = "0.1.0"
edition = "2021"
authors = ["Aravindh Sampath Kumar"]
description = "AI-friendly CalDAV CLI for Fastmail calendar management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aravindhsampath/fastcal"
readme = "README.md"
keywords = ["caldav", "calendar", "fastmail", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# CalDAV client (proven with Fastmail)
libdav = "0.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
futures-util = "0.3"

# HTTP client (for libdav)
hyper = "1"
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# iCalendar parsing/generation (for libdav responses)
calcard = "0.3"

# Error handling
anyhow = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Config directory
dirs = "6.0"

# HTTP types
http = "1"

# Base64 encoding (for Basic Auth)
base64 = "0.22"

# Password input
rpassword = "7.4"

# Tower for Service trait
tower = "0.5"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
mockito = "1.5"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "fastcal"
path = "src/main.rs"
